<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | Come2Huelva</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#12271e">
    
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/x-icon" href="img/faviconnuevo.ico">
    <link rel="apple-touch-icon" href="img/faviconnuevo.ico">
    <link rel="stylesheet" href="styles.css">
    
    <style>
        :root {
            --gold-brown: #af8d54;
            --dark-green: #12271e;
            --white: #fdfbf7;
            --light-grey: #f2f2f2;
            --ink: #0f1b16;
            --transition: 0.3s cubic-bezier(.4, 2, .3, 1);
            --font-primary: "Source Sans Pro", sans-serif;
            --font-secondary: "Cormorant Garamond", serif;
        }
        
        body {
            font-family: var(--font-primary);
            background: var(--light-grey);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            margin: 0;
        }
        
        .error-container {
            max-width: 600px;
            text-align: center;
            background: var(--white);
            padding: 4rem 3rem;
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 60px rgba(18, 39, 30, 0.12);
            border: 1px solid rgba(175, 141, 84, .1);
        }
        
        .error-code {
            font-size: clamp(6rem, 8vw, 8rem);
            font-weight: 700;
            color: var(--gold-brown);
            line-height: 1;
            margin-bottom: 1.5rem;
            font-family: var(--font-secondary);
            text-shadow: 0 2px 8px rgba(175, 141, 84, 0.2);
        }   
        
        h1 {
            font-size: clamp(2rem, 3vw, 2.5rem);
            color: var(--dark-green);
            margin-bottom: 1.5rem;
            font-family: var(--font-secondary);
            font-weight: 700;
            letter-spacing: 0.05em;
        }
        
        p {
            font-size: clamp(1.1rem, 1.5vw, 1.2rem);
            color: var(--ink);
            margin-bottom: 2.5rem;
            line-height: 1.8;
            opacity: 0.85;
        }
        
        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: var(--dark-green);
            color: var(--white);
            text-decoration: none;
            border-radius: 999px;
            font-size: clamp(1rem, 1.2vw, 1.1rem);
            font-weight: 600;
            font-family: var(--font-primary);
            transition: all var(--transition);
            box-shadow: 0 4px 16px rgba(18, 39, 30, 0.2);
            letter-spacing: 0.03em;
        }
        
        .btn:hover {
            background: var(--gold-brown);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(175, 141, 84, 0.3);
        }
        
        @media (max-width: 768px) {
            body {
                padding: 1.5rem;
            }
            
            .error-container {
                padding: 3rem 2rem;
            }
            
            .error-code {
                margin-bottom: 1rem;
            }
            
            h1 {
                margin-bottom: 1rem;
            }
            
            p {
                margin-bottom: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1>Página no encontrada</h1>
        <p>
            Lo sentimos, la página que buscas no existe o ha sido movida.
            <br>
            Vuelve al inicio y descubre las maravillas de Huelva.
        </p>
        <a href="index.html" class="btn">Volver al inicio</a>
    </div>
</body>
</html>
